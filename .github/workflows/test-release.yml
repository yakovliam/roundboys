name: Build a test release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version (major.minor.patch)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: roundboys-test-release
  cancel-in-progress: false
jobs:
  build:
    # Use a dedicated, logged-in Mac with Xcode tools, Rust, and local licensed assets.
    # Do not run pull request code on this runner.
    runs-on: [self-hosted, macOS, ARM64, roundboys]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ROUNDBOYS_ASSET_ROOT: ${{ vars.ROUNDBOYS_ASSET_ROOT }}
      ROUNDBOYS_APP_IDENTITY: ${{ vars.ROUNDBOYS_APP_IDENTITY }}
      ROUNDBOYS_INSTALLER_IDENTITY: ${{ vars.ROUNDBOYS_INSTALLER_IDENTITY }}
      ROUNDBOYS_NOTARY_PROFILE: ${{ vars.ROUNDBOYS_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and check
        run: python3 tools/release.py --version "$RELEASE_VERSION"
      - name: Upload a draft test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "RoundBoys Test Bench $RELEASE_VERSION" \
            --notes-file release/NOTES.md \
            "dist/roundboys-$RELEASE_VERSION-macos-arm64/"*.pkg \
            "dist/roundboys-$RELEASE_VERSION-macos-arm64/"*.zip \
            "dist/roundboys-$RELEASE_VERSION-macos-arm64/SHA256SUMS.txt" \
            "dist/roundboys-$RELEASE_VERSION-macos-arm64/manifest.json"
